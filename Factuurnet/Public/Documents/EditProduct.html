<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Product Bewerken</title>
  <link rel="stylesheet" href="./css/footer.css">
   <link rel="stylesheet" href="./css/EditProducts.css" />
</head>
<body>

    <header>
    <div href="/" class="logo">Factuurnet</div>
    <nav>
      <a href="/products">Product Beheer</a>
      <a href="/dashboard"> Alle debiteuren </a>
      <a href="/invoiceselect">Home</a>
      <a href="/settings">instellingen</a>
    </nav>
  </header>

<div class="edit-container">
  <div class="edit-box">

    <h1>Product Bewerken</h1>

    <form>

      <label>Productnaam</label>
      <input type="text" name="name" placeholder="Voer productnaam in">

      <label>Factuuromschrijving</label>
      <textarea name="invoice_description" placeholder="Wordt weergegeven op facturen"></textarea>

      <label>Eenheid</label>
      <input type="text" name="unit" placeholder="bijv. stuks, uren …">

      <label>Prijs excl. BTW</label>
      <input type="number" step="0.01" name="price_excl_vat" placeholder="0,00">

      <label>BTW Percentage</label>
      <input type="number" step="0.01" name="vat_percentage" placeholder="bijv. 21">
       

     

   


      <label for="prijsPer">Prijs per</label>
            <select id="prijsPer" required>
               <option value="eenmalig" selected>Eenmalig</option>
                <option value="wekelijks">Wekelijks</option>
                <option value="maandelijks">Maandelijks</option>
                <option value="kwartaal">Per kwartaal</option>
                <option value="halfjaarlijks">Halfjaarlijks</option>
                <option value="jaarlijks">Jaarlijks</option>
            </select>

      <label>Kostensoort</label>
      <input type="text" name="cost_type" placeholder="bijv. materiaal, arbeid">

      <button type="submit" id="submit" class="save-btn">Wijzigingen Opslaan</button>

    </form>

  </div>
</div>

<footer>
  © 2025 Product Manager
</footer>

</body>
</html>

<script src="./JS/editProduct.js"></script>
